# tufte — coffee variant (warm "black coffee" ink)
# Creamy paper, coffee-dark ink, a rare drop of vermillion.
# Syntax/UI hues ride a single warm luminance ramp instead of full color —
# vermillion (red) is the only saturated color, reserved for errors/accent.

mode = "light"

accent = "#a00000"
selection = "#ffec99"
muted = "#d1cdc4"

background = "#f5eddf"
dark_background = "#e8e2d6"
darker_background = "#ded8cd"
lighter_background = "#e3ddd2"

foreground = "#2d1c0b"
dark_foreground = "#857b6f"
light_foreground = "#514333"
bright_foreground = "#403020"

red = "#a00000"
green = "#857b6f"
yellow = "#6c6052"
blue = "#5d5042"
magenta = "#514333"
cyan = "#403020"

bright_red = "#a00000"
bright_green = "#857b6f"
bright_yellow = "#6c6052"
bright_blue = "#5d5042"
bright_magenta = "#514333"
bright_cyan = "#403020"
